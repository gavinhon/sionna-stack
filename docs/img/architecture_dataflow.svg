<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>sionna-stack data flow</title>
  <desc>OpenStreetMap building data goes into the scene generator (Mitsuba XML, PLY, geographic origin). The Sionna RT experiment, driven by a TOML config, computes paths, radio maps and the moving transmitter. The geo exporter converts results to PNG, CZML, GeoJSON and GLB for the CesiumJS viewer in the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; }
      .p rect { fill: #EEEDFE; stroke: #534AB7; } .p .t { fill: #3C3489; } .p .s { fill: #534AB7; }
      .n rect { fill: #FFFFFF; stroke: #888780; } .n .t { fill: #2C2C2A; } .n .s { fill: #5F5E5A; }
      line { stroke: #5F5E5A; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="680" height="470" fill="#FFFFFF"/>
  <g class="n"><rect x="220" y="30" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="350" y="48" text-anchor="middle" dominant-baseline="central">OpenStreetMap</text>
    <text class="s" x="350" y="68" text-anchor="middle" dominant-baseline="central">building outlines + heights</text></g>
  <g class="p"><rect x="220" y="116" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="350" y="134" text-anchor="middle" dominant-baseline="central">Scene generator</text>
    <text class="s" x="350" y="154" text-anchor="middle" dominant-baseline="central">Mitsuba XML, PLY, origin</text></g>
  <g class="n"><rect x="40" y="202" width="150" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="115" y="220" text-anchor="middle" dominant-baseline="central">Experiment config</text>
    <text class="s" x="115" y="240" text-anchor="middle" dominant-baseline="central">TOML: bands, TX, RX</text></g>
  <g class="p"><rect x="220" y="202" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="350" y="220" text-anchor="middle" dominant-baseline="central">Sionna RT experiment</text>
    <text class="s" x="350" y="240" text-anchor="middle" dominant-baseline="central">paths, radio maps, moving TX</text></g>
  <g class="p"><rect x="220" y="288" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="350" y="306" text-anchor="middle" dominant-baseline="central">Geo exporter</text>
    <text class="s" x="350" y="326" text-anchor="middle" dominant-baseline="central">PNG, CZML, GeoJSON, GLB</text></g>
  <g class="p"><rect x="220" y="374" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="350" y="392" text-anchor="middle" dominant-baseline="central">CesiumJS viewer</text>
    <text class="s" x="350" y="412" text-anchor="middle" dominant-baseline="central">3-D globe in your browser</text></g>
  <line x1="350" y1="86" x2="350" y2="112" marker-end="url(#arrow)"/>
  <line x1="350" y1="172" x2="350" y2="198" marker-end="url(#arrow)"/>
  <line x1="190" y1="230" x2="216" y2="230" marker-end="url(#arrow)"/>
  <line x1="350" y1="258" x2="350" y2="284" marker-end="url(#arrow)"/>
  <line x1="350" y1="344" x2="350" y2="370" marker-end="url(#arrow)"/>
  <text x="496" y="230" font-size="12" fill="#5F5E5A" dominant-baseline="central">scripts/run_experiment.py</text>
  <text x="496" y="316" font-size="12" fill="#5F5E5A" dominant-baseline="central">scripts/export_geo.py</text>
  <text x="496" y="144" font-size="12" fill="#5F5E5A" dominant-baseline="central">scripts/make_osm_scene.py</text>
  <text x="496" y="402" font-size="12" fill="#5F5E5A" dominant-baseline="central">scripts/viewer.sh</text>
</svg>
