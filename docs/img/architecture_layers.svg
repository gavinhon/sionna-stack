<svg xmlns="http://www.w3.org/2000/svg" width="680" height="588" viewBox="0 0 680 588" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>sionna-stack architecture: software layers</title>
  <desc>Windows 11 host with the NVIDIA driver, the separate AODT distro and the browser. Inside WSL2 Ubuntu 24.04: CesiumJS viewer, JupyterLab and CLI scripts on top of the sionna_stack package, Sionna RT and PyTorch, Mitsuba and Dr.Jit, and the CUDA plus OptiX GPU backend or the LLVM CPU fallback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; }
      .p rect { fill: #EEEDFE; stroke: #534AB7; } .p .t { fill: #3C3489; } .p .s { fill: #534AB7; }
      .g rect { fill: #E1F5EE; stroke: #0F6E56; } .g .t { fill: #085041; } .g .s { fill: #0F6E56; }
      .n rect { fill: #FFFFFF; stroke: #888780; } .n .t { fill: #2C2C2A; } .n .s { fill: #5F5E5A; }
    </style>
  </defs>
  <rect width="680" height="588" fill="#FFFFFF"/>
  <rect x="30" y="20" width="620" height="548" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text class="t" x="50" y="40" fill="#444441" dominant-baseline="central">Windows 11 host</text>
  <rect x="50" y="56" width="580" height="416" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
  <text class="t" x="70" y="76" fill="#2C2C2A" dominant-baseline="central">WSL2 · Ubuntu 24.04 (user gavin)</text>

  <g class="p"><rect x="70" y="96" width="166" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="153" y="114" text-anchor="middle" dominant-baseline="central">CesiumJS viewer</text>
    <text class="s" x="153" y="134" text-anchor="middle" dominant-baseline="central">Vite · port 5180</text></g>
  <g class="p"><rect x="256" y="96" width="166" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="339" y="114" text-anchor="middle" dominant-baseline="central">JupyterLab</text>
    <text class="s" x="339" y="134" text-anchor="middle" dominant-baseline="central">notebook · port 8890</text></g>
  <g class="p"><rect x="442" y="96" width="166" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="525" y="114" text-anchor="middle" dominant-baseline="central">CLI scripts</text>
    <text class="s" x="525" y="134" text-anchor="middle" dominant-baseline="central">setup · run · export</text></g>
  <g class="p"><rect x="70" y="172" width="538" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="339" y="190" text-anchor="middle" dominant-baseline="central">sionna_stack (Python package)</text>
    <text class="s" x="339" y="210" text-anchor="middle" dominant-baseline="central">backend · experiment · mobility · geo · layout</text></g>

  <g class="g"><rect x="70" y="248" width="258" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="199" y="266" text-anchor="middle" dominant-baseline="central">Sionna RT 2.1</text>
    <text class="s" x="199" y="286" text-anchor="middle" dominant-baseline="central">paths · radio maps · materials</text></g>
  <g class="g"><rect x="348" y="248" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="478" y="266" text-anchor="middle" dominant-baseline="central">PyTorch 2.14</text>
    <text class="s" x="478" y="286" text-anchor="middle" dominant-baseline="central">link-level PHY/SYS</text></g>
  <g class="g"><rect x="70" y="324" width="538" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="339" y="342" text-anchor="middle" dominant-baseline="central">Mitsuba 3.9 + Dr.Jit 1.5</text>
    <text class="s" x="339" y="362" text-anchor="middle" dominant-baseline="central">scene · JIT compiler · autodiff</text></g>
  <g class="g"><rect x="70" y="400" width="258" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="199" y="418" text-anchor="middle" dominant-baseline="central">CUDA + OptiX (GPU)</text>
    <text class="s" x="199" y="438" text-anchor="middle" dominant-baseline="central">user-level OptiX 590.48</text></g>
  <g class="g"><rect x="348" y="400" width="260" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="478" y="418" text-anchor="middle" dominant-baseline="central">LLVM 20 (CPU)</text>
    <text class="s" x="478" y="438" text-anchor="middle" dominant-baseline="central">automatic fallback</text></g>

  <g class="n"><rect x="50" y="492" width="186" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="143" y="510" text-anchor="middle" dominant-baseline="central">NVIDIA driver 591.86</text>
    <text class="s" x="143" y="530" text-anchor="middle" dominant-baseline="central">RTX 5080 · 16 GB</text></g>
  <g class="n"><rect x="251" y="492" width="186" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="344" y="510" text-anchor="middle" dominant-baseline="central">Ubuntu-22.04 · AODT</text>
    <text class="s" x="344" y="530" text-anchor="middle" dominant-baseline="central">separate, not touched</text></g>
  <g class="n"><rect x="452" y="492" width="186" height="56" rx="8" stroke-width="0.8"/>
    <text class="t" x="545" y="510" text-anchor="middle" dominant-baseline="central">Browser</text>
    <text class="s" x="545" y="530" text-anchor="middle" dominant-baseline="central">localhost :5180 · :8890</text></g>
  <line x1="143" y1="492" x2="143" y2="460" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
