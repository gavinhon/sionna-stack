# WIDE-AREA example: Singapore's Downtown Core, 2 km x 2 km (Boat Quay / Padang -> Marina Bay Sands / Gardens by
# the Bay), with a realistic macro NETWORK (9 rooftop sites x 3 sectors) and 12 receivers at named places.
# The small-area studies (sg_raffles_place, sg_macro, sg_smallcell_mmwave) zoom into 600 m around Raffles Place.
#
# Scene (generator v2 + water: Marina Bay, the Singapore River and the Kallang Basin are a water surface with the
# ITU-R P.840 water model; all other ground is concrete), created with:
#   uv run scripts/make_osm_scene.py --name sg_downtown_core --lat 1.2851 --lon 103.8561 --size 2000
#
# Transmitters: a hexagonal macro layout, inter-site distance 500 m (dense urban), each site on the nearest flat
# roof 25-100 m high (macro antennas sit on mid-rise roofs, not on 250 m tower tops); each sector mounted 3 m
# above the roof at the roof edge it faces (30/150/270 deg), downtilt towards the cell edge; grid points over the
# bay get no site. Generated with:
#   uv run scripts/suggest_sites.py scenes/sg_downtown_core --isd 500
# Same antenna and power as sg_macro.toml: 4 x 1 panel of 3GPP TR 38.901 elements (~14 dBi), 46 dBm per sector.
# Every phone is served by the strongest sector (best server); no interference yet (SNR, not SINR).
#
# Receivers: phones at 1.5 m at landmarks found by name in OpenStreetMap (Overpass, 2026-09-28), moved to the
# nearest outdoor point >= 2 m from walls and >= 3 m from the water (one is a water taxi on the bay).

[experiment]
name = "sg_downtown_core"
description = "Singapore Downtown Core 2 km x 2 km: 9-site macro network (27 sectors, 46 dBm), 12 landmark receivers, 700 MHz / 1.8 / 3.5 GHz"

[scene]
source = "../scenes/sg_downtown_core/scene.xml"

[bands]
ghz = [0.7, 1.8, 3.5]
bandwidth_mhz = [10, 20, 100]
noise_figure_db = 7.0
extrapolate_materials = true   # 700 MHz is below the ITU-R P.2040 range of concrete, marble, metal (flagged)

[antennas]
tx_pattern = "tr38901"
tx_rows = 4
tx_cols = 1
tx_vertical_spacing = 0.5
rx_pattern = "iso"
polarization = "V"

[[transmitters]]
