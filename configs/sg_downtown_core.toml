[paths]
# as in the Singapore studies: specular + refraction + diffraction for the link lines; receiver levels come from
# the converged radio map (docs: "Accuracy settings")
max_depth = 10
samples_per_src = 3_000_000
diffraction = true
edge_diffraction = true
diffuse_reflection = false
deterministic = true
seed = 42

[radio_map]
center = [0.0, 0.0, 1.5]
size = [2000.0, 2000.0]
cell_size = [2.0, 2.0]
samples_per_tx = 1_000_000_000   # per sector, as in the small-area studies
max_depth = 10
diffraction = true
edge_diffraction = true
diffuse_reflection = true
seed = 42
display_metric = "rx_power"
vmin_db = -110.0
vmax_db = -20.0   # as sg_macro: the macro network is strong almost everywhere
coverage_threshold_db = -130.0

[render]
camera_position = [-1100.0, -2000.0, 2300.0]
camera_look_at = [0.0, 0.0, 0.0]
resolution = [1400, 1050]
num_samples = 64
paths_camera_position = [-700.0, -1300.0, 1400.0]
paths_camera_look_at = [-150.0, -50.0, 0.0]

# 3-D signal volume (coverage shells + height slider + dark view in the viewer), as for Raffles Place but on
# 8 m cells (2 km: 31 heights x 250 x 250 cells) and solved a few sectors at a time (see src/sionna_stack/volume.py).
# 3e8 rays per sector on 8 m cells = more rays per cell than the Raffles volumes (3e8 on 4 m cells).
[volume]
height_start = 1.5
height_step = 5.0
height_stop = 150.0
cell_size = 8.0
samples_per_tx = 300_000_000
shell_levels = [-45.0, -35.0, -25.0]    # received power [dBm], inside every band's p5-p95 range (tools/volume_stats.py):
                                        # 700 MHz -37..-18, 3.5 GHz -51..-32 dBm; the network is strong everywhere
slice_y = 0.0                           # vertical-cut figure west-east through the middle (Fullerton - bay - MBS)
